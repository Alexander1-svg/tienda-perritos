apiVersion: apps/v1
kind: Deployment
metadata:
  name: tienda-frontend
  namespace: tienda

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tienda-frontend

  template:
    metadata:
      labels:
        app: tienda-frontend

    spec:
      containers:
      - name: frontend
        image: 849508003074.dkr.ecr.us-east-1.amazonaws.com/tienda-perrito-frontend:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10